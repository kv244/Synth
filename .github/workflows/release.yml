name: Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: C:\JUCE
          key: juce-windows-9.0.0

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: git clone --depth=1 --branch 9.0.0 https://github.com/juce-framework/JUCE.git C:\JUCE

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DJUCE_DIR="C:/JUCE" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python test dependencies
        run: pip install pedalboard mido numpy

      - name: Run plugin tests
        run: python test_midi.py

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG_VERSION=$(python -c "import re; text=open('CMakeLists.txt').read(); m=re.search(r'project\(BasicSynth VERSION\s+(\d+\.\d+\.\d+)', text); print(m.group(1))")
          fi
          echo "tag=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
              /DPRODUCT_VERSION=${{ steps.version.outputs.tag }} `
              installer.nsi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Neon Synth v${{ steps.version.outputs.tag }}"
          tag_name: "v${{ steps.version.outputs.tag }}"
          body: |
            ## Neon Synth v${{ steps.version.outputs.tag }}
            **Author:** Razvan Julian Petrescu / AudioDSP

            ### Installation
            Run **NeonSynth-${{ steps.version.outputs.tag }}-Windows-Setup.exe**.

            The installer copies:
            | Component | Destination |
            |---|---|
            | VST3 plugin | `C:\Program Files\Common Files\VST3\BasicSynth.vst3` |
            | Standalone app | `C:\Program Files\AudioDSP\Neon Synth\BasicSynth.exe` |

            ### Requirements
            - Windows 10 / 11 (64-bit)
            - VST3-compatible DAW for the plugin (Ableton, Bitwig, FL Studio, Reaper …)

            ### What's new
          files: NeonSynth-${{ steps.version.outputs.tag }}-Windows-Setup.exe
          generate_release_notes: true
