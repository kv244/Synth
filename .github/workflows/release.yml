name: Release

# Publishes a release only when a version tag is pushed:
#
#   1. Bump the version in CMakeLists.txt (both places) and installer.nsi, update the
#      user manual ("Applies to", edition) and redraw its cover
#      (python docs/figures/cover.py --date "<release date>"), and merge to master.
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# The job refuses to run if the tag doesn't match the CMakeLists.txt version, if
# the manual or its cover still names another version, or if a release for the tag
# already exists, so a release is never overwritten. Pushing to master publishes
# nothing. The manual is printed to PDF first (job manual); the installer carries that PDF in
# the NeonSynth folder, and after the release is created attach-manual attaches the same file.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Prints the user manual to PDF once. The installer packs this file and the release gets the
  # same one. build_manual.py checks the manual against the source first, so a release with a
  # manual or cover from another version stops here.
  manual:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.14'

      - name: Install the PDF tools
        run: |
          pip install -r docs/requirements-manual.txt
          # --with-deps installs Chromium's libraries and fonts through apt. When the runner can't
          # reach Ubuntu's package servers (PR #20 hit that three times in an hour), install the
          # browser alone: the runner image already carries Chrome's libraries.
          timeout 300 python -m playwright install --with-deps chromium || python -m playwright install chromium
          fc-list | grep -qiE 'liberation sans|dejavu sans' \
            || echo '::warning::Neither Liberation Sans nor DejaVu Sans is installed; the PDF falls back to another font'

      - name: Print the manual to PDF
        run: python docs/build_manual.py --out build/manual

      - name: Keep the PDF for the installer and the release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: NeonSynth-User-Manual
          path: build/manual/*.pdf
          if-no-files-found: error
          retention-days: 1

  build-installer:
    needs: manual
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - name: Check the tag against CMakeLists.txt and existing releases
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CMAKE_VERSION=$(python -c "import re; text=open('CMakeLists.txt').read(); print(re.search(r'project\(NeonSynth VERSION\s+(\d+\.\d+\.\d+)', text).group(1))")
          if [[ "$TAG_VERSION" != "$CMAKE_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $CMAKE_VERSION"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::A release for $GITHUB_REF_NAME already exists; bump the version instead of re-releasing"
            exit 1
          fi
          echo "tag=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check the manual matches this release
        run: python docs/build_manual.py --check

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830        # v4.3.0
        with:
          path: C:\JUCE
          key: juce-windows-9.0.0

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: git clone --depth=1 --branch 9.0.0 https://github.com/juce-framework/JUCE.git C:\JUCE

      - name: Configure
        run: cmake -S . -B build -DJUCE_DIR="C:/JUCE" -DNEONSYNTH_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.14'

      - name: Install Python test dependencies
        run: pip install -r requirements-test.txt

      - name: Python test suite (VST3)
        run: python test_midi.py

      - name: pluginval (strictness 10)
        shell: pwsh
        run: |
          # GitHub's download servers sometimes answer 5xx (PR #16 failed on a 504), so retry.
          $url = 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip'
          foreach ($try in 1..4) {
            try { Invoke-WebRequest $url -OutFile pluginval.zip; break }
            catch { if ($try -eq 4) { throw }; Write-Host "pluginval download failed ($_), retrying"; Start-Sleep -Seconds (15 * $try) }
          }
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --skip-gui-tests `
              --validate build\NeonSynth_artefacts\Release\VST3\NeonSynth.vst3
          exit $LASTEXITCODE

      - name: Get the manual PDF for the installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: NeonSynth-User-Manual
          path: build/manual

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
              /DPRODUCT_VERSION=${{ steps.version.outputs.tag }} `
              installer.nsi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2.6.2
        with:
          name: "Neon Synth v${{ steps.version.outputs.tag }}"
          tag_name: "v${{ steps.version.outputs.tag }}"
          body: |
            ## Neon Synth v${{ steps.version.outputs.tag }}
            **Author:** Razvan Julian Petrescu / AudioDSP

            ### Installation
            Run **NeonSynth-${{ steps.version.outputs.tag }}-Windows-Setup.exe**.

            The installer copies:
            | Component | Destination |
            |---|---|
            | VST3 plugin | `C:\Program Files\Common Files\VST3\NeonSynth.vst3` |
            | Standalone app | `C:\Program Files\AudioDSP\Neon Synth\NeonSynth.exe` |
            | User manual (PDF) | `C:\Program Files\AudioDSP\Neon Synth\NeonSynth-User-Manual-${{ steps.version.outputs.tag }}.pdf` |

            Upgrading from BasicSynth (v1.3 and earlier)? The installer removes the old
            `BasicSynth.vst3`; projects saved with BasicSynth open with NeonSynth.

            The user manual is attached as **NeonSynth-User-Manual-${{ steps.version.outputs.tag }}.pdf**
            (also readable online in `docs/NeonSynth-User-Manual.md`).

            ### Requirements
            - Windows 10 / 11 (64-bit)
            - VST3-compatible DAW for the plugin (Ableton, Bitwig, FL Studio, Reaper …)

            ### What's new
          files: NeonSynth-${{ steps.version.outputs.tag }}-Windows-Setup.exe
          generate_release_notes: true

  # Attaches the manual PDF (the one inside the installer) to the release created above.
  attach-manual:
    needs: build-installer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get the manual PDF
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: NeonSynth-User-Manual
          path: build/manual

      - name: Attach the PDF to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" build/manual/*.pdf --clobber
