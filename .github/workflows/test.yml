name: Test

# Every pull request (and every push to master) builds the plugin and all test
# programs on Windows, then runs the unit tests, the Python suite against the
# VST3, and pluginval. A PR can only be trusted to release once this is green.

on:
  pull_request:
    branches: [master, main, oscillators]
  push:
    branches: [master, main, oscillators]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830        # v4.3.0
        with:
          path: C:\JUCE
          key: juce-windows-9.0.0

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: git clone --depth=1 --branch 9.0.0 https://github.com/juce-framework/JUCE.git C:\JUCE

      - name: Configure
        run: cmake -S . -B build -DJUCE_DIR="C:/JUCE" -DNEONSYNTH_BUILD_TESTS=ON

      - name: Build plugin, unit tests and benchmark
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.14'

      - name: Install Python test dependencies
        run: pip install -r requirements-test.txt

      - name: Python test suite (VST3)
        run: python test_midi.py

      - name: pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 5 --validate-in-process --skip-gui-tests `
              --output-dir pluginval-logs --validate build\NeonSynth_artefacts\Release\VST3\NeonSynth.vst3
          exit $LASTEXITCODE

      - name: Upload pluginval log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: pluginval-log
          path: pluginval-logs
          if-no-files-found: ignore

      - name: CPU benchmark
        shell: pwsh
        run: |
          $result = & build\RenderBenchmark_artefacts\Release\RenderBenchmark.exe | Out-String
          $result
          "### CPU benchmark (GitHub runner, so only roughly comparable)`n``````n$result``````" >> $env:GITHUB_STEP_SUMMARY
