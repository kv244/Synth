name: Test

# Every pull request, and every push to master or to an integration branch (v17,
# v18, ...), builds the plugin and all test programs on Windows, then runs the unit
# tests, the Python suite against the VST3, the comparison with the reference
# release, and pluginval at the strictness the release uses. A PR can only be
# trusted to release once this is green.
#
# A push to a PR's own branch (v17-p3, review-fixes) starts nothing here: the
# pull_request event already tests it, and running both doubled every check.

on:
  pull_request:
    branches: [master, main, 'v[0-9]*']
  push:
    branches: [master, main, 'v[0-9]+']   # v17, not v17-p3: a PR's own branch is tested by pull_request alone

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830        # v4.3.0
        with:
          path: C:\JUCE
          key: juce-windows-9.0.0

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: git clone --depth=1 --branch 9.0.0 https://github.com/juce-framework/JUCE.git C:\JUCE

      - name: Configure
        run: cmake -S . -B build -DJUCE_DIR="C:/JUCE" -DNEONSYNTH_BUILD_TESTS=ON

      - name: Build plugin, unit tests and benchmark
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.14'

      - name: Install Python test dependencies
        run: pip install -r requirements-test.txt

      - name: Python test suite (VST3)
        run: python test_midi.py

      # Sessions saved with the reference release must render bit-identically (every new
      # parameter defaults to neutral). The reference is built once from its tag and cached;
      # the runner image is in the key, since a new compiler could round differently.
      - name: Reference release
        id: reference
        shell: pwsh
        run: |
          "version=v1.6.0" >> $env:GITHUB_OUTPUT
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Cache the reference VST3
        id: cache-reference
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830        # v4.3.0
        with:
          path: reference
          key: neonsynth-${{ steps.reference.outputs.version }}-vst3-${{ steps.reference.outputs.image }}-juce-9.0.0

      - name: Build the reference VST3
        if: steps.cache-reference.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $tag = '${{ steps.reference.outputs.version }}'
          git fetch --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"
          git worktree add ..\reference-src $tag
          cmake -S ..\reference-src -B ..\reference-build -DJUCE_DIR="C:/JUCE"
          cmake --build ..\reference-build --config Release --parallel --target NeonSynth_VST3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory reference | Out-Null
          Copy-Item -Recurse -Path ..\reference-build\NeonSynth_artefacts\Release\VST3\NeonSynth.vst3 -Destination reference\NeonSynth.vst3
          Get-ChildItem -Recurse reference | Select-Object -ExpandProperty FullName

      - name: Sessions from the reference release render identically
        run: python tests/compare_versions.py reference/NeonSynth.vst3 build/NeonSynth_artefacts/Release/VST3/NeonSynth.vst3

      - name: pluginval (strictness 10, the same as release.yml)
        shell: pwsh
        run: |
          # GitHub's download servers sometimes answer 5xx (PR #16 failed on a 504), so retry.
          $url = 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip'
          foreach ($try in 1..4) {
            try { Invoke-WebRequest $url -OutFile pluginval.zip; break }
            catch { if ($try -eq 4) { throw }; Write-Host "pluginval download failed ($_), retrying"; Start-Sleep -Seconds (15 * $try) }
          }
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --skip-gui-tests `
              --output-dir pluginval-logs --validate build\NeonSynth_artefacts\Release\VST3\NeonSynth.vst3
          exit $LASTEXITCODE

      - name: Upload pluginval log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: pluginval-log
          path: pluginval-logs
          if-no-files-found: ignore

      - name: CPU benchmark
        shell: pwsh
        run: |
          $result = & build\RenderBenchmark_artefacts\Release\RenderBenchmark.exe | Out-String
          $result
          "### CPU benchmark (GitHub runner, so only roughly comparable)`n``````n$result``````" >> $env:GITHUB_STEP_SUMMARY
