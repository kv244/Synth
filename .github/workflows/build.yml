name: Build

on:
  push:
    branches: [master, main, 'v[0-9]*']
  pull_request:
    branches: [master, main, 'v[0-9]*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - name: Install required system dependencies
        run: |
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20'
          sudo apt-get $APT update -q
          sudo apt-get $APT install -y \
            cmake ninja-build \
            libasound2-dev \
            libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libfreetype6-dev libglib2.0-dev libgl1-mesa-dev libgtk-3-dev \
            xvfb

      - name: Install WebKit (name differs between Ubuntu 22.04 / 24.04)
        run: |
          sudo apt-get install -y libwebkit2gtk-4.0-dev 2>/dev/null || \
          sudo apt-get install -y libwebkit2gtk-4.1-dev 2>/dev/null || \
          echo "WebKit unavailable — JUCE_WEB_BROWSER=0 will suppress the dependency"

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830        # v4.3.0
        with:
          path: /tmp/JUCE
          key: juce-${{ runner.os }}-9.0.0

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: git clone --depth=1 --branch 9.0.0 https://github.com/juce-framework/JUCE.git /tmp/JUCE

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DJUCE_DIR=/tmp/JUCE \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEONSYNTH_BUILD_TESTS=ON

      - name: Build VST3 and unit tests
        run: cmake --build build --target NeonSynth_VST3 unit_tests

      - name: Unit tests (GCC)
        run: xvfb-run -a ctest --test-dir build --output-on-failure   # EditorTests needs an X display
