name: Lint

on:
  push:
    branches: [master, main, 'v[0-9]+']   # v17, not v17-p3: a PR's own branch is tested by pull_request alone
  pull_request:
    branches: [master, main, 'v[0-9]*']

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.14'

      - name: Install ruff
        run: pip install ruff==0.16.9

      - name: Lint every Python file (test suite, tools, manual and figure scripts)
        run: ruff check .
